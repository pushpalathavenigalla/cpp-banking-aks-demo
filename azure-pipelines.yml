trigger:
- master

pool:
  vmImage: 'ubuntu-latest'

steps:

- script: |
    mkdir build
    cd build
    cmake ..
    cmake --build .
  displayName: 'Build C++ Web Application'

- task: Docker@2
  displayName: 'Build and Push Image'
  inputs:
    command: buildAndPush
    repository: welcomewebapp
    dockerfile: Dockerfile
    containerRegistry: 'welcomewebapp-docker-con'
    tags: |
      latest